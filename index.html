<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#243D33">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>Yên &amp; Cá · Private Journey</title>
  <link rel="stylesheet" href="./css/access-gate.css?v=20260905-real-media">
  <link rel="stylesheet" href="./css/access-gate-brand.css?v=20260901-ty-badge-v2">
</head>
<body class="baby-locked">
  <section class="access-gate" id="babyAccessGate" aria-label="Khóa hành trình Baby">
    <div class="access-gate__panel">
      <div class="access-gate__lock" aria-hidden="true">YC</div>
      <p class="access-gate__eyebrow">DISCOVERY</p>
      <h1>Hành Trình của Yên &amp; Cá</h1>

      <div class="access-gate__row">
        <input
          id="babyAccessInput"
          class="access-gate__input"
          type="password"
          inputmode="numeric"
          autocomplete="off"
          aria-label="Mật khẩu"
          placeholder="Nhập mật khẩu"
        >
        <button id="babyAccessSubmit" class="access-gate__submit" type="button">Open</button>
      </div>

      <div id="babyAccessError" class="access-gate__error" role="status">Sai mật khẩu, thử lại</div>
    </div>
  </section>

  <div id="babyAppRoot"></div>

  <script src="./js/access-gate.js?v=20260905-real-media"></script>
</body>
</html>
